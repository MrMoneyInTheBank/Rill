version: "3"

dotenv: ['.env']

vars:
  BUILD_DIR: build
  BINARY: rill

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  fmt:
    desc: Format Go source files
    cmds:
      - gofmt -w ./cmd ./internal

  lint:
    desc: Lint code
    cmds:
      - go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test ./... {{.CLI_ARGS}}

  check:
    desc: Lint and test
    cmds:
      - task: lint
      - task: test

  build:
    desc: Build Rill
    cmds:
      - task: check
      - go build -o ./{{.BUILD_DIR}}/{{.BINARY}} ./cmd/feed

  run:
    desc: Build and run Rill
    deps: [build]
    cmds:
      - "./{{.BUILD_DIR}}/{{.BINARY}}"

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf ./{{.BUILD_DIR}}
